---
name: otbr
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    # Sem teto, qualquer container pode consumir a maquina inteira do operador.
    mem_limit: 1g
    cpus: 2
    environment:
      MARIADB_DATABASE: "${CANARY_DB_NAME:-canary}"
      MARIADB_USER: "${CANARY_DB_USER:-canary}"
      MARIADB_PASSWORD: "${CANARY_DB_PASSWORD:-canary}"
      MARIADB_ROOT_PASSWORD: "${CANARY_DB_ROOT_PASSWORD:-root}"
      TZ: "${CANARY_TIMEZONE:-America/Fortaleza}"
    networks:
      - canary-net
    volumes:
      - 'db-volume:/var/lib/mysql'
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    image: "${CANARY_IMAGE:-ghcr.io/opentibiabr/canary:latest}"
    restart: unless-stopped
    mem_limit: 4g
    cpus: 6
    # Entrypoint proprio: aplica a configuracao do Hegemony que o start.sh da
    # imagem nao cobre, e so entao chama o start.sh. Ver o cabecalho do script.
    entrypoint: ["/bin/bash", "/hegemony/entrypoint.sh"]
    environment:
      # O servidor calcula "hoje" com localtime(). Sem TZ o container roda em
      # UTC: a criatura e o boss do dia trocavam as 21h de Brasilia, e a
      # "ultima visita" aparecia 3 horas adiantada para o jogador.
      TZ: "${CANARY_TIMEZONE:-America/Fortaleza}"
      CANARY_DB_HOST: "${CANARY_DB_HOST:-db}"
      CANARY_DB_PORT: "${CANARY_DB_PORT:-3306}"
      CANARY_DB_NAME: "${CANARY_DB_NAME:-canary}"
      CANARY_DB_USER: "${CANARY_DB_USER:-canary}"
      CANARY_DB_PASSWORD: "${CANARY_DB_PASSWORD:-canary}"
      CANARY_SERVER_NAME: "${CANARY_SERVER_NAME:-Hegemony PvP}"
      CANARY_SERVER_IP: "${CANARY_SERVER_IP:-127.0.0.1}"
      CANARY_LOGIN_PORT: "${CANARY_LOGIN_PORT:-7171}"
      CANARY_GAME_PORT: "${CANARY_GAME_PORT:-7172}"
      CANARY_LEGACY_1100_GAME_PORT: "${CANARY_LEGACY_1100_GAME_PORT:-7174}"
      CANARY_LEGACY_860_GAME_PORT: "${CANARY_LEGACY_860_GAME_PORT:-7175}"
      CANARY_STATUS_PORT: "${CANARY_STATUS_PORT:-7173}"
      CANARY_STATUS_TIMEOUT: "${CANARY_STATUS_TIMEOUT:-5000}"
      CANARY_TEST_ACCOUNTS: "${CANARY_TEST_ACCOUNTS:-true}"
      CANARY_DATA_PACK: "${CANARY_DATA_PACK:-data-otservbr-global}"
      CANARY_MAP_URL: "${CANARY_MAP_URL:-https://github.com/opentibiabr/canary/releases/download/v3.6.1/otservbr.otbm}"
      # Keep the published runtime image compatible while CANARY_* remains the
      # public quickstart contract.
      OT_DB_HOST: "${CANARY_DB_HOST:-db}"
      OT_DB_PORT: "${CANARY_DB_PORT:-3306}"
      OT_DB_DATABASE: "${CANARY_DB_NAME:-canary}"
      OT_DB_USER: "${CANARY_DB_USER:-canary}"
      OT_DB_PASSWORD: "${CANARY_DB_PASSWORD:-canary}"
      OT_SERVER_IP: "${CANARY_SERVER_IP:-127.0.0.1}"
      OT_SERVER_LOGIN_PORT: "${CANARY_LOGIN_PORT:-7171}"
      OT_SERVER_GAME_PORT: "${CANARY_GAME_PORT:-7172}"
      OT_SERVER_STATUS_PORT: "${CANARY_STATUS_PORT:-7173}"
      OT_SERVER_TEST_ACCOUNTS: "${CANARY_TEST_ACCOUNTS:-true}"
      OT_SERVER_DATA: "${CANARY_DATA_PACK:-data-otservbr-global}"
      OT_SERVER_MAP: "${CANARY_MAP_URL:-https://github.com/opentibiabr/canary/releases/download/v3.6.1/otservbr.otbm}"
    networks:
      - canary-net
    ports:
      - '${CANARY_LOGIN_PORT:-7171}:${CANARY_LOGIN_PORT:-7171}'
      - '${CANARY_GAME_PORT:-7172}:${CANARY_GAME_PORT:-7172}'
      - '${CANARY_LEGACY_1100_GAME_PORT:-7174}:${CANARY_LEGACY_1100_GAME_PORT:-7174}'
      - '${CANARY_LEGACY_860_GAME_PORT:-7175}:${CANARY_LEGACY_860_GAME_PORT:-7175}'
      - '${CANARY_STATUS_PORT:-7173}:${CANARY_STATUS_PORT:-7173}'
    volumes:
      - 'server-data:/data'
      - './hegemony/entrypoint.sh:/hegemony/entrypoint.sh:ro'
      # Duas correcoes pontuais do datapack, montadas arquivo a arquivo.
      #
      # O datapack inteiro nao e montado de proposito: o mapa de 190 MB e
      # baixado pelo start.sh para dentro de data-otservbr-global/world/, entao
      # montar a pasta do repo faria o servidor rebaixar o mapa para dentro do
      # git a cada container novo.
      - '../data-otservbr-global/monster/quests/heart_of_destruction/eradicator2.lua:/canary/data-otservbr-global/monster/quests/heart_of_destruction/eradicator2.lua:ro'
      - '../data-otservbr-global/scripts/globalevents/others/check_mount.lua:/canary/data-otservbr-global/scripts/globalevents/others/check_mount.lua:ro'
      - '../data/scripts/actions/items/potions.lua:/canary/data/scripts/actions/items/potions.lua:ro'
      # Regras proprias do Hegemony (mapa so Venore, morte, loja). Pasta nova,
      # nao existe na imagem: montar inteira nao esconde nada do upstream.
      - '../data-otservbr-global/scripts/hegemony:/canary/data-otservbr-global/scripts/hegemony:ro'
      # Spawns de NPC sem os 64 de Venore: o receptador (scripts/hegemony) e o
      # unico que negocia, e barco/carruagem seriam saidas da cidade. NPC
      # removido por script renasce sozinho em 60 s, por isso o corte e aqui.
      # O arquivo so e montado; o mapa baixado continua fora do git.
      - '../data-otservbr-global/world/otservbr-npc.xml:/canary/data-otservbr-global/world/otservbr-npc.xml:ro'
    depends_on:
      db:
        condition: service_healthy

  myaac:
    build:
      context: .
      dockerfile: quickstart/myaac/Dockerfile
      args:
        MYAAC_REF: "${MYAAC_REF:-develop}"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 2
    environment:
      CANARY_DB_HOST: "${CANARY_DB_HOST:-db}"
      CANARY_DB_PORT: "${CANARY_DB_PORT:-3306}"
      CANARY_DB_NAME: "${CANARY_DB_NAME:-canary}"
      CANARY_DB_USER: "${CANARY_DB_USER:-canary}"
      CANARY_DB_PASSWORD: "${CANARY_DB_PASSWORD:-canary}"
      CANARY_SERVER_NAME: "${CANARY_SERVER_NAME:-Hegemony PvP}"
      CANARY_SERVER_IP: "${CANARY_SERVER_IP:-127.0.0.1}"
      CANARY_SERVER_LOCATION: "${CANARY_SERVER_LOCATION:-BRA}"
      TZ: "${CANARY_TIMEZONE:-America/Fortaleza}"
      CANARY_LOGIN_PORT: "${CANARY_LOGIN_PORT:-7171}"
      CANARY_GAME_PORT: "${CANARY_GAME_PORT:-7172}"
      CANARY_STATUS_PORT: "${CANARY_STATUS_PORT:-7173}"
      CANARY_STATUS_TIMEOUT: "${CANARY_STATUS_TIMEOUT:-5000}"
      CANARY_DATA_PACK: "${CANARY_DATA_PACK:-data-otservbr-global}"
      MYAAC_SITE_URL: "${MYAAC_SITE_URL:-http://localhost:8080}"
      MYAAC_ADMIN_ACCOUNT: "${MYAAC_ADMIN_ACCOUNT:-myaacadmin}"
      MYAAC_ADMIN_EMAIL: "${MYAAC_ADMIN_EMAIL:-admin@localhost.local}"
      MYAAC_ADMIN_PASSWORD: "${MYAAC_ADMIN_PASSWORD:-admin123}"
      MYAAC_ADMIN_PLAYER: "${MYAAC_ADMIN_PLAYER:-ADM1}"
      MYAAC_CLIENT_VERSION: "${MYAAC_CLIENT_VERSION:-1513}"
      MYAAC_TIMEZONE: "${MYAAC_TIMEZONE:-America/Fortaleza}"
    ports:
      - '${MYAAC_HTTP_PORT:-8080}:80'
    volumes:
      # Tema proprio versionado no repositorio. Sem este mount o tema so
      # existiria na camada gravavel do container e sumiria no primeiro
      # "docker compose build myaac".
      #
      # O caminho aponta para dentro do repo de proposito. Antes vinha de
      # ../site/, um clone do MyAAC com .git proprio: o git tratava como
      # repositorio aninhado e nao versionava o tema: em qualquer maquina que
      # so clonasse este repo, o mount criava um diretorio vazio e o site subia
      # sem tema.
      - './quickstart/myaac/templates/hegemony:/var/www/html/templates/hegemony'
    networks:
      - canary-net
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started

  login-server:
    image: "${LOGIN_SERVER_IMAGE:-opentibiabr/login-server:latest}"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    environment:
      TZ: "${CANARY_TIMEZONE:-America/Fortaleza}"
      LOGIN_HTTP_PORT: "${LOGIN_HTTP_PORT:-8088}"
      LOGIN_GRPC_PORT: "${LOGIN_GRPC_PORT:-9090}"
      MYSQL_HOST: "${CANARY_DB_HOST:-db}"
      MYSQL_PORT: "${CANARY_DB_PORT:-3306}"
      MYSQL_DBNAME: "${CANARY_DB_NAME:-canary}"
      MYSQL_USER: "${CANARY_DB_USER:-canary}"
      MYSQL_PASS: "${CANARY_DB_PASSWORD:-canary}"
      SERVER_NAME: "${CANARY_SERVER_NAME:-Hegemony PvP}"
      SERVER_IP: "${CANARY_SERVER_IP:-127.0.0.1}"
      SERVER_PORT: "${CANARY_GAME_PORT:-7172}"
      SERVER_LOCATION: "${CANARY_SERVER_LOCATION:-BRA}"
      RATE_LIMITER_RATE: "${LOGIN_RATE_LIMITER_RATE:-2}"
      RATE_LIMITER_BURST: "${LOGIN_RATE_LIMITER_BURST:-5}"
    ports:
      - '${LOGIN_HTTP_PORT:-8088}:${LOGIN_HTTP_PORT:-8088}'
      - '${LOGIN_GRPC_PORT:-9090}:${LOGIN_GRPC_PORT:-9090}'
    networks:
      - canary-net
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-volume:
  server-data:

networks:
  canary-net:
    driver: bridge
